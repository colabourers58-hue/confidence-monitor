<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lyrics">
<meta name="theme-color" content="#000000">
<title>Lyrics</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  @font-face{font-family:StageFallback;src:url(fonts/inter-800.woff2) format('woff2');font-weight:700 900;font-display:swap}
  @font-face{font-family:StageFallback;src:url(fonts/inter-600.woff2) format('woff2');font-weight:400 600;font-display:swap}
  :root{
    --live:#ffd60a; --label:#fff;
    --label-2:rgba(235,235,245,.60); --label-3:rgba(235,235,245,.30); --label-4:rgba(235,235,245,.16);
    --fill:rgba(120,120,128,.24); --pending:rgba(255,214,10,.42);
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  ::selection{background:var(--live);color:#000}
  html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",StageFallback,sans-serif;
       -webkit-font-smoothing:antialiased;color:var(--label);-webkit-user-select:none;user-select:none}
  /* the pointer hides only while it sits still, so a stage screen stays clean but a mouse is never lost */
  body.still, body.still *{cursor:none !important}
  #orb{position:fixed;inset:0;width:100%;height:100%;z-index:0}

  #ui{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity:0;transition:opacity .6s var(--ease)}
  body.song #ui{opacity:1}

  #bar{flex:0 0 auto;text-shadow:0 1px 12px rgba(0,0,0,.35);display:flex;align-items:center;gap:.72em;padding:2.4vmin max(4vmin,4.5%) 1.8vmin;
       font-size:clamp(13px,2.5vh,30px);line-height:1}
  #dot{width:1.05em;height:1.05em;flex:0 0 auto}             /* the orb lands here */
  #title{font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #sect{flex:0 0 auto;font-weight:600;color:var(--live);opacity:0;transition:opacity .22s}
  #sect.show{opacity:1}
  #sect::before{content:"";display:inline-block;width:.3em;height:.3em;border-radius:50%;background:var(--label-3);
                margin:0 .62em .12em 0;vertical-align:middle}
  #clock{margin-left:auto;flex:0 0 auto;font-weight:500;color:var(--label-3);font-variant-numeric:tabular-nums}

  /* the lyrics: one column that glides so the line being sung always sits at the same height */
  #view{flex:1 1 auto;position:relative;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 15%,#000 80%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 15%,#000 80%,transparent 100%)}
  #col{position:absolute;left:0;right:0;top:0;padding:0 max(5vmin,7%);will-change:transform;
       font-size:6.4vh;transition:transform .8s cubic-bezier(.2,.9,.22,1)}
  .ln{margin:0 0 .62em;text-align:center;font-weight:700;line-height:1.13;letter-spacing:-.021em;
      text-wrap:balance;color:rgba(255,255,255,.30);filter:blur(1.4px);transform:scale(.88);
      transition:color .5s,filter .5s,transform .7s cubic-bezier(.2,.9,.22,1)}
  .ln.brk{margin-top:1.1em}                      /* a new section starts */
  .ln.near{color:rgba(255,255,255,.55);filter:blur(.35px);transform:scale(.9)}
  .ln.past{color:rgba(255,255,255,.20);filter:blur(1.8px)}
  .ln.on{color:var(--live);filter:none;transform:scale(1.12)}
  .ln.pending{color:var(--pending);filter:none;transform:scale(1.12)}
  /* a sung or quoted lyric: the whole passage as one block, sized to fill the screen */
  #blockView{flex:1 1 auto;display:none;align-items:center;justify-content:center;
             padding:1vh max(5vmin,6%) 2vh;overflow:hidden}
  body.words #view{display:none}
  body.words #blockView{display:flex}
  #blk{width:100%;text-align:center;transition:opacity .35s}
  #blkSec{font-weight:600;font-size:.40em;letter-spacing:.16em;text-transform:uppercase;color:var(--live);margin-bottom:.8em}
  #blkLines p{margin:0 0 .26em;font-weight:700;line-height:1.14;letter-spacing:-.02em;color:rgba(255,255,255,.93);text-wrap:balance;
              transition:color .35s}
  #blkLines p.sung{color:rgba(255,255,255,.52)}
  #blkLines p.hit{color:var(--live)}
  #blkNext{margin-top:1.15em;color:var(--label-3);font-weight:600;font-size:.6em;line-height:1.22;text-wrap:balance}
  #blkNext span{display:block;font-size:.62em;letter-spacing:.16em;text-transform:uppercase;margin-bottom:.45em}
  #mapWrap{flex:0 0 auto;overflow:hidden;padding:0 0 2.4vmin;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
  #map{display:flex;align-items:flex-end;gap:clamp(16px,2.6vw,44px);white-space:nowrap;padding:0 11%;
       font-size:clamp(12px,2.1vh,26px);line-height:1;will-change:transform;transition:transform .55s var(--ease)}
  #map .sec{flex:0 0 auto;display:flex;flex-direction:column;gap:.62em}
  #map .sec u{text-decoration:none;font-weight:600;letter-spacing:-.008em;color:var(--label-3);text-align:center;transition:color .22s}
  #map .sec.on u{color:var(--label)}
  #map .sec i{display:block;height:.55em;min-height:6px;border-radius:99px;background:var(--fill);position:relative;overflow:hidden}
  #map .sec i::after{content:"";position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(var(--f,0));
                     background:var(--live);border-radius:99px;transition:transform .25s linear}
  #map .sec.done i::after{transform:scaleX(1);background:var(--label-4)}

  /* reveal: when a song is caught the words rise out of the orb's flare */
  body.caught #view,body.caught #blockView{animation:rise .95s .42s var(--ease) both}
  body.caught #bar,body.caught #mapWrap{animation:fade .8s .6s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:scale(.94);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  body.huge #mapWrap{display:none}
  body.words #clock{visibility:hidden}
  #zoomTag{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;padding:.5em .95em;border-radius:.7em;
    background:rgba(28,28,30,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    font-weight:600;font-size:2.4vh;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .25s;pointer-events:none}
  #zoomTag.show{opacity:1}

  #gate{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
        padding-bottom:13vh;gap:1.4vh;cursor:pointer;transition:opacity .5s var(--ease)}
  #gate b{font-weight:600;font-size:clamp(17px,2.8vh,30px);letter-spacing:-.01em}
  #gate small{color:var(--label-3);font-weight:500;font-size:clamp(12px,1.8vh,20px)}
  #gate.gone{opacity:0;pointer-events:none}
  /* the control panel: what it hears, what it did, how fast */
  #cp{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
      overflow:auto;cursor:auto;-webkit-user-select:text;user-select:text}
  #cp[hidden]{display:none}
  #cp .wrap{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
            display:flex;flex-direction:column;gap:16px}
  #cp header{display:flex;align-items:center;justify-content:space-between}
  #cp h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
  #cp h3{font-size:13px;font-weight:600;color:var(--label-2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
  #cp .card{background:rgba(44,44,46,.78);border-radius:18px;padding:16px}
  #cp button{font:inherit;cursor:pointer;border:0;border-radius:12px}
  #cpDone{font-size:17px;font-weight:600;padding:10px 18px;background:var(--live);color:#000}
  .meter{height:14px;border-radius:7px;background:rgba(120,120,128,.24);overflow:hidden}
  .meter i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#30d158,#ffd60a 70%,#ff453a);transition:width .08s linear}
  .mrow{display:flex;justify-content:space-between;font-size:14px;color:var(--label-2);margin-top:8px;font-variant-numeric:tabular-nums}
  .warn{color:#ff9f0a;font-weight:600}
  #devlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  #devlist .dev{font-size:16px;text-align:left;padding:13px 15px;background:rgba(120,120,128,.18);color:var(--label)}
  #devlist .dev.on{background:var(--live);color:#000;font-weight:600}
  .now{font-size:18px;font-weight:600;line-height:1.35}
  .now small{display:block;font-size:14px;font-weight:500;color:var(--label-2);margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stats div{background:rgba(120,120,128,.14);border-radius:12px;padding:12px}
  .stats b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stats span{font-size:13px;color:var(--label-2)}
  #log{display:flex;flex-direction:column;gap:2px;max-height:48vh;overflow:auto}
  #log div{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:8px 2px;border-bottom:1px solid rgba(84,84,88,.35);font-size:14px;line-height:1.35}
  #log time{color:var(--label-3);font-variant-numeric:tabular-nums}
  #log .id{color:#30d158} #log .miss{color:#ff9f0a} #log .heard{color:var(--label-2)}
  #cpCopy{font-size:15px;font-weight:600;padding:10px 14px;background:rgba(120,120,128,.24);color:var(--label);margin-top:10px}
  #cpBtn{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;
         width:44px;height:44px;border-radius:22px;border:0;background:rgba(120,120,128,.16);display:flex;align-items:center;
         justify-content:center;opacity:.35;cursor:pointer;transition:opacity .2s}
  #cpBtn:hover,#cpBtn:focus-visible{opacity:.9}
  #cpBtn svg{width:22px;height:22px}
  #load{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:7;width:min(260px,40vw);height:7px;
        border-radius:3px;background:var(--fill);overflow:hidden;transition:opacity .5s}
  #load i{display:block;height:100%;width:0;background:var(--label-3);transition:width .2s}
  #load.done{opacity:0}
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div id="ui">
  <div id="bar"><i id="dot"></i><span id="title"></span><span id="sect"></span><span id="clock"></span></div>
  <div id="view"><div id="col"></div></div>
  <div id="blockView"><div id="blk"><div id="blkSec"></div><div id="blkLines"></div><div id="blkNext"></div></div></div>
  <div id="mapWrap"><div id="map"></div></div>
</div>
<div id="zoomTag"></div>
<div id="load"><i></i></div>
<button id="cpBtn" aria-label="Control panel"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg></button>
<div id="cp" hidden><div class="wrap">
  <header><h2>Control Panel</h2><button id="cpDone">Done</button></header>
  <section class="card"><h3>Listening</h3>
    <div class="meter"><i id="cpMeter"></i></div>
    <div class="mrow"><span id="cpLevel">–</span><span id="cpHearing">–</span></div>
    <div id="devlist"></div></section>
  <section class="card"><h3>Right now</h3><div class="now" id="cpNow">–</div></section>
  <section class="card"><h3>This session</h3><div class="stats" id="cpStats"></div></section>
  <section class="card"><h3>Log</h3><div id="log"></div><button id="cpCopy">Copy log</button></section>
</div></div>
<div id="gate"><b>Tap to begin</b><small>One tap allows the microphone. After that it runs on its own.</small></div>
<script type="module" src="app.js"></script>
</body>
</html>
